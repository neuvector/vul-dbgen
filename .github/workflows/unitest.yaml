name: Run unitest on push and pull request
on:
  push:
  pull_request:
jobs:
  unitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
        with:
          go-version: '1.22.7'
      - run: |
          ./unitest.sh
